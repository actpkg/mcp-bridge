[package]
name = "mcp-bridge"
description = "Proxies a remote MCP server's tools as ACT tools"
version = "0.3.0"
edition = "2024"

[dependencies]
# A direct dep because this is a hand-rolled bridge, not an SDK-macro
# component: `lib.rs` calls `wit_bindgen::generate!` and `spawn_local` itself.
#
# The graph carried two wit-bindgen majors for a while (published `act-sdk`
# pinned 0.60 while `hclient-wasi` reached 0.62 through `wasip3`) — noted here
# as something to watch, not fix. It collapsed to a single 0.62.0 on its own at
# `act-sdk` 0.14.2, exactly as expected. Nothing to do; left as a worked example
# of a duplication that was fine to leave alone.
wit-bindgen = { version = "0.62", features = ["async-spawn"] }
# `default-features = false` keeps the IDN/ICU chain (a `default` feature) out
# of the wasm binary; nothing here feeds a non-ASCII host to the client. SSE
# and incremental body reads are unconditional in `hclient`, so streaming the
# Streamable-HTTP transport costs no feature.
#
# **The family does not move in lockstep, and must not be "corrected".** The
# lock holds `hclient` alpha.15, `hclient-proto` alpha.8, `hclient-core`
# **0.2.1** and `hclient-wasi` **0.1.2**. Bump all four by name out of habit —
# it costs nothing and localises an upstream regression:
#   cargo update -p hclient -p hclient-wasi -p hclient-core -p hclient-proto
#
# **The "can't leave prerelease while a prerelease dep is in the public path"
# theory this note used to state is WRONG — corrected 2026-09-25.** It held
# only for `hclient-core`'s *first* graduation to `0.1.0`; `hclient-core` has
# since done an independent `0.1.0 -> 0.2.1` jump of its own; `hclient` is
# still alpha.15 and `hclient-proto` still alpha.8. So the four crates version
# independently once past the seam, full stop — do not reconstruct a rule from
# which ones happen to be stable this week.
#
# **`hclient-core` 0.2.0's changelog carries several `[**breaking**]` entries**
# (IPC as its own trait, `MemoryStore` dropped, the three support-report shapes
# unified) and none of it reached this component: build, clippy, 66 unit tests
# and all 14 e2e tests (real HTTP/SSE against the stub server) passed unchanged
# against 0.2.1. A breaking changelog entry upstream is a reason to build and
# test before trusting the bump, not a reason to expect a source change — check
# whether the changed surface is even in `Cargo.lock` (as with `hclient-dns`
# below) before assuming it applies.
#
# **alpha.10 -> alpha.13 was a lockfile-only change for this component.** It is
# not free of hazard, though: alpha.13 changed `ClientBuilder::build()` from
# `Result<Client, UnsupportedCapability>` to `Result<Client, BuildError>`, a
# new enum wrapping the old type alongside an `InvalidCodingToken` variant.
# `client()` in `mcp_client.rs` writes `.map_err(|e| ... format!("{e}"))`, which
# is `Display`-based and absorbed the change silently — had it named or matched
# the type, this would have been a source break inside a `cargo update`.
# `InvalidCodingToken` is unreachable here (decompression is never negotiated),
# but the error is a sum type now and a future reader should know it.
#
# **alpha.13 -> alpha.14 changed nothing that reaches this component, and the
# check is cheap enough to repeat.** `hclient`'s own `src/` is byte-identical
# across the two releases (`diff -rq` over the vendored copies says so); the
# release only raises its internal requirements, one of which — `hclient-rt` —
# graduated to a stable 0.1.0. `hclient-wasi` 0.1.0 -> 0.1.1 is likewise
# source-identical. The changelog's sole entry is marked **breaking**, which is
# alarming until you read it: it is `hclient-dns` leaving the pre-release
# series, and `hclient-dns` is **not in this graph at all** — `default-features
# = false` keeps the native transport out and `WasiHttp` resolves its own names.
# A `[**breaking**]` line in this family's changelog is therefore not by itself
# a reason to expect work here; check whether the named crate is in `Cargo.lock`
# first.
#
# The API this component names is facade-only — `Client`, `RequestBody`,
# `Response`, `Timeouts`, `sse::{SseStream, SseEvent}`, `WasiHttp` — and
# `hclient_core` appears nowhere in `src/`. Most of those re-export from
# `hclient-core`, so they travel under whatever semver `hclient-core` is
# currently keeping (0.x, so a minor bump there can be breaking — see the
# 0.2.0 note above). `Timeouts` stays the exception worth watching —
# re-verified at `hclient-core` 0.2.1, still four bounds, still
# `#[non_exhaustive]`, so a fifth bound is not a breaking change upstream and
# semver will not announce it — `timeouts()` sets `connect` and `first_byte`
# and deliberately leaves `between_bytes` unbounded for the SSE leg.
hclient = { version = "0.1.0-alpha.15", default-features = false }
hclient-wasi = "0.1.2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
act-types = "0.14.2"
act-sdk = "0.14.2"
ciborium = "0.2"
base64 = "0.23"
rmcp = { version = "3.4.1", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[lib]
crate-type = ["cdylib"]
