[package]
name = "mcp-bridge"
description = "Proxies a remote MCP server's tools as ACT tools"
version = "0.2.2"
edition = "2024"

[dependencies]
wit-bindgen = { version = "0.58", features = ["async-spawn"] }
wasi-fetch = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
act-types = "0.12"
ciborium = "0.2"
base64 = "0.22"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[lib]
crate-type = ["cdylib"]
